apiVersion: v2
name: gateway-api-routes
description: Kubernetes Gateway API - Routing Layer. Part of the Gateway API charts. Replace your ingress to the native Kubernetes Gateway API.
type: application
version: 2.0.0
appVersion: "1.6.2"
# TLSRoute CEL validation (Gateway API v1.5+) requires Kubernetes 1.31 or newer.
# The -0 suffix is required: Helm semver treats vendor tags like 1.31.4-eks-a1b2c3
# as prereleases, which a bare >=1.31.0 constraint would reject.
kubeVersion: ">=1.31.0-0"
home: https://charts.cdnn.host/
sources:
  - https://github.com/dev2prod-hub/gateway-api-chart/tree/main/charts/gateway-api-routes
keywords:
  - gateway-api-routes
  - gateway api helm chart
  - helm
  - helm chart
  - networking
  - Kubernetes
  - ingress
maintainers:
  - name: dev2prod
    email: k@kazakov.xyz
    url: https://cdnn.cloud
  - name: Kirill Kazakov
    email: k@kazakov.xyz
    url: https://kazakov.xyz
icon: https://avatars.githubusercontent.com/u/191972069?s=96&v=4
dependencies: [] # Optional dependencies if applicable
