version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for all action bumps: they are reviewed together anyway, and a
      # stream of separate PRs against a repo that publishes a chart is noise.
      actions:
        patterns: ["*"]
